:root{
  --navy:#1C2B48;--cel:#8EB1D1;
  --shell:#F4F6F8;--card:#FFFFFF;--soft:#F6F8FA;
  --line:#E5E9EF;--line2:#EEF1F5;
  --tx:#1C2B48;--tx2:#4C5A72;--tx3:#717D90;
  --sel:#E3ECF6;--act:#D6E4F1;--hover:#EEF2F7;
  --unread:#CF3B15;--dot:#E84419;
  --in:#F0F3F7;--out:#1C2B48;
  --g:#22713F;--gbg:#E3F2E8;--a:#8A5F00;--abg:#FBF0D9;--r:#B3261E;--rbg:#FBE7E5;--b:#2558A8;--bbg:#E3EDF9;--n:#3B4A66;--nbg:#EAEFF5;--z:#5A667A;--zbg:#EEF0F3;--t:#22636B;--tbg:#DDEEF0;
  --shadow:0 12px 32px rgba(16,24,40,.16),0 2px 8px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Outfit,system-ui,sans-serif;font-size:14px;color:var(--tx);background:var(--shell);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{height:100vh;min-width:1180px;display:grid;grid-template-rows:64px 1fr;position:relative}
/* top */
.top{display:flex;align-items:center;padding:0 12px 0 12px;gap:6px;min-width:0}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);position:relative;flex:none}
.ib:hover{background:#E7ECF2}
.ib svg.i{width:20px;height:20px}
.ib.on{background:var(--act);color:var(--navy)}
.ib .bd{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--dot);border:2px solid var(--shell)}
.logo{display:flex;align-items:center;gap:10px;margin-right:10px;cursor:pointer}
.mark{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.prod{font-size:20px;color:var(--tx2)}
.picker{height:44px;display:flex;align-items:center;gap:10px;padding:0 10px 0 6px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:236px;text-align:left}
.picker:hover{border-color:#CDD5DF}
.picker.on{border-color:var(--navy)}
.bdg{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;letter-spacing:.3px}
.picker b{display:block;font-size:14px;font-weight:600;line-height:1.15}
.picker span{display:block;font-size:12px;color:var(--tx3);line-height:1.2}
.picker>svg.i{margin-left:auto;color:var(--tx3);width:16px;height:16px}
.search{margin-left:22px;flex:1;max-width:640px;height:48px;border-radius:12px;background:#E8EDF3;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;color:var(--tx2)}
.search:focus-within{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12);outline:1px solid var(--line)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.search input::placeholder{color:var(--tx3)}
.tr{margin-left:auto;display:flex;align-items:center;gap:2px}
.me{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;margin-left:6px}
/* body */
.body{display:grid;grid-template-columns:248px minmax(0,1fr) 56px;min-height:0}
.body.nc{grid-template-columns:76px minmax(0,1fr) 56px}
.nav{padding:4px 12px 120px 8px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.compose{height:56px;border-radius:16px;background:var(--act);display:inline-flex;align-items:center;gap:12px;padding:0 22px 0 18px;font-size:15px;font-weight:600;color:var(--navy);margin:4px 0 14px 4px;width:fit-content;white-space:nowrap}
.compose:hover{box-shadow:0 1px 4px rgba(16,24,40,.18)}
.compose svg.i{width:20px;height:20px}
.ni{display:flex;align-items:center;gap:14px;height:36px;padding:0 12px 0 16px;border-radius:10px;color:var(--tx2);font-size:14px;width:100%;text-align:left;white-space:nowrap}
.ni:hover{background:#E7ECF2}
.ni svg.i{width:19px;height:19px}
.ni.on{background:var(--act);color:var(--navy);font-weight:600}
.ni .c{margin-left:auto;font-size:13px;font-weight:600;color:var(--tx2)}
.ni.on .c{color:var(--navy)}
.ni .c.o{color:var(--unread)}
.ns{font-size:13px;font-weight:600;color:var(--tx3);padding:18px 16px 6px;white-space:nowrap}
.sq{width:11px;height:11px;border-radius:3px;flex:none;margin:0 4px}
.body.nc .ni span.l,.body.nc .ni .c,.body.nc .ns,.body.nc .compose span{display:none}
.body.nc .compose{padding:0 18px;width:56px;justify-content:center}
.body.nc .ni{padding:0;justify-content:center}
/* card */
.card{background:var(--card);border-radius:16px;margin:0 0 12px 0;display:grid;grid-template-columns:350px minmax(0,1fr);overflow:hidden;min-height:0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card.wside{grid-template-columns:350px minmax(0,1fr) 330px}
.card.full{display:flex;flex-direction:column}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lh{height:60px;display:flex;align-items:center;padding:0 12px 0 20px;gap:8px;flex:none}
.lh h2{font-size:19px;font-weight:600;margin:0;white-space:nowrap}
.lh .cn{color:var(--tx3);font-size:13px;margin-top:3px;white-space:nowrap}
.lsc{flex:1;overflow-y:auto;padding-bottom:12px}
.take{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:10px 12px 10px 14px;border-radius:12px;background:#FDEEE8;color:#9A3412}
.take b{display:block;font-size:13.5px;color:#7C2D12;white-space:nowrap}
.take span{display:block;font-size:12px;color:#9A3412;white-space:nowrap}
.take .btn{margin-left:auto;background:#CF3B15;border-color:#CF3B15;color:#fff}
.take .btn:hover{background:#B5330F}
.sec{font-size:12.5px;font-weight:600;color:var(--tx3);padding:10px 20px 6px;display:flex;justify-content:space-between}
.row{display:flex;gap:12px;padding:11px 14px;margin:0 8px;border-radius:12px;width:calc(100% - 16px);text-align:left}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none}
.rm{flex:1;min-width:0}
.r1,.r2,.r3{display:flex;align-items:center;gap:8px;min-width:0}
.r1 .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.un .nm{font-weight:700}
.r1 .t{margin-left:auto;font-size:12.5px;color:var(--tx3);white-space:nowrap}
.row.un .t{color:var(--navy);font-weight:600}
.r2{margin-top:2px}
.r2 .pv{font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row.un .pv{color:var(--tx)}
.r2 .pv b{font-weight:500;color:var(--tx3)}
.cnt{min-width:20px;height:20px;border-radius:6px;background:var(--unread);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.r3{margin-top:7px;gap:6px}
.ch{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.ch svg.i{width:13px;height:13px}
.ch.b{color:var(--b);background:var(--bbg)}.ch.n{color:var(--n);background:var(--nbg)}.ch.s{color:var(--navy);background:var(--act)}.ch.a{color:var(--a);background:var(--abg)}.ch.g{color:var(--g);background:var(--gbg)}.ch.z{color:var(--z);background:var(--zbg)}.ch.r{color:var(--r);background:var(--rbg)}.ch.t{color:var(--t);background:var(--tbg)}
.ch.o{color:var(--tx2);background:#fff;border:1px solid var(--line)}
.who{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3)}
.free{width:22px;height:22px;border-radius:50%;border:1.5px dashed #9AA6B8;display:grid;place-items:center;color:#7A8699;flex:none}
.free svg.i{width:12px;height:12px}
.empty{padding:48px 28px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--tx);font-size:16px;font-weight:600;margin:12px 0 4px}
.empty .ei{width:56px;height:56px;border-radius:16px;background:var(--sel);color:var(--navy);display:grid;place-items:center;margin:0 auto}
.empty .ei svg.i{width:26px;height:26px}
/* thread */
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.th{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;border-bottom:1px solid var(--line);flex:none}
.th .nm{min-width:0}
.th .nm b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .nm span{font-size:13px;color:var(--tx3);white-space:nowrap}
.th .act{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.btn{height:38px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn svg.i{width:17px;height:17px}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:#26385C}
.btn.p:disabled{opacity:.4;cursor:default}
.btn.sm{height:34px;font-size:13px;padding:0 12px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:20px 40px 8px;display:flex;flex-direction:column;gap:8px}
.msgs>*{flex:none}
.msgs .sp{flex:1}
.day{align-self:center;font-size:12.5px;color:var(--tx3);font-weight:500;margin:6px 0}
.bb{max-width:70%;padding:9px 14px 7px;font-size:14.5px;line-height:1.42;border-radius:20px;white-space:pre-wrap;word-wrap:break-word}
.bb.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:6px}
.bb.out{align-self:flex-end;background:var(--out);color:#fff;border-bottom-right-radius:6px}
.bb .mt{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;margin-top:2px;color:var(--tx3)}
.bb.out .mt{color:rgba(255,255,255,.7)}
.bb .mt svg.i{width:14px;height:14px}
.lab{align-self:flex-end;font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:5px;margin:6px 4px -2px}
.lab svg.i{width:13px;height:13px}
.ev{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--tx3);margin:8px 0}
.ev:before,.ev:after{content:"";flex:1;height:1px;background:var(--line)}
.ev svg.i{width:14px;height:14px}
.note{align-self:flex-end;max-width:70%;background:#FFF6DD;border:1px solid #F1E0AE;border-radius:16px;padding:9px 14px;font-size:14px;white-space:pre-wrap}
.note .h{font-size:12px;color:#8A5F00;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.note .h svg.i{width:13px;height:13px}
.nosel{flex:1;display:grid;place-items:center}
/* composer */
.cmp{padding:6px 24px 18px;flex:none;position:relative}
.cbar{display:flex;align-items:center;gap:18px;font-size:13px;padding:0 6px 8px}
.tab{color:var(--tx3);font-weight:500;padding-bottom:4px;border-bottom:2px solid transparent}
.tab.on{color:var(--navy);font-weight:600;border-color:var(--navy)}
.win{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap}
.win .d{width:8px;height:8px;border-radius:50%}
.win.g{color:var(--g)}.win.g .d{background:#2D8C4E}
.win.a{color:var(--a)}.win.a .d{background:#C98A00}
.win.r{color:var(--r)}.win.r .d{background:#C62828}
.cbox{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 12px 8px 16px}
.cbox:focus-within{border-color:#9FB6CF;background:#fff}
.cbox.note{background:#FFFBEF;border-color:#F1E0AE;max-width:none;align-self:auto;padding:10px 12px 8px 16px}
.cbox textarea{width:100%;border:0;background:transparent;outline:none;resize:none;height:46px;font-size:14.5px;line-height:1.4}
.cbox textarea::placeholder{color:var(--tx3)}
.ctb{display:flex;align-items:center;gap:4px;color:var(--tx2)}
.ctb .ib{width:34px;height:34px}
.ctb .ib svg.i{width:18px;height:18px}
.ctb .sug{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--tx2);padding:0 8px;height:34px;border-radius:8px}
.ctb .sug:hover{background:#E7ECF2}
.ctb .sug svg.i{width:16px;height:16px}
.ctb .hint{margin-left:auto;font-size:12px;color:var(--tx3);margin-right:10px;white-space:nowrap}
.send{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{background:#26385C}
.warn{display:flex;align-items:center;gap:10px;background:var(--abg);color:var(--a);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:8px}
.tplc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.tplc .hd{display:flex;gap:10px;padding:12px 16px;background:var(--rbg);color:var(--r);font-size:13.5px;align-items:flex-start}
.tplc .hd.w{background:var(--nbg);color:var(--n)}
.tplc .hd b{display:block;font-weight:600}
.tplc .bd2{display:grid;grid-template-columns:1fr 1fr}
.tl .it{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:13.5px;width:100%;text-align:left}
.tl .it:hover{background:var(--hover)}
.tl .it.on{background:var(--sel);font-weight:600}
.tl .it small{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:400}
.tpv{border-left:1px solid var(--line);padding:12px 16px;font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.tpv .bb{max-width:100%;font-size:13.5px;align-self:stretch}
.tpv .row2{display:flex;justify-content:flex-end;gap:8px;margin-top:auto}
.qr{position:absolute;left:24px;right:24px;bottom:100%;margin-bottom:-4px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.qr .h{font-size:12px;font-weight:600;color:var(--tx3);padding:10px 14px 4px}
.qr .it{display:flex;gap:12px;padding:9px 14px;width:100%;text-align:left;align-items:baseline}
.qr .it.on{background:var(--sel)}
.qr .it b{font-size:13.5px;width:110px;flex:none}
.qr .it span{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* side */
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{height:60px;display:flex;align-items:center;padding:0 12px 0 20px;flex:none}
.sh h3{margin:0;font-size:17px;font-weight:600}
.sh .ib{margin-left:auto}
.sb{padding:0 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.idt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 2px}
.idt b{font-size:18px;font-weight:600;margin-top:10px}
.idt span{font-size:13px;color:var(--tx3);margin-top:1px}
.qa{display:flex;gap:18px;justify-content:center;margin-top:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2)}
.qa i{width:40px;height:40px;border-radius:50%;background:var(--sel);display:grid;place-items:center;color:var(--navy)}
.qa button:hover i{background:var(--act)}
.qa i svg.i{width:17px;height:17px}
.grp{background:var(--soft);border-radius:14px}
.gt{font-size:12.5px;font-weight:600;color:var(--tx3);padding:10px 14px 2px}
.gr{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line2);width:100%;text-align:left;position:relative}
.gr:last-child{border-bottom:0}
button.gr:hover{background:#EEF2F6}
.gr .k{color:var(--tx2);width:108px;flex:none}
.gr .v{display:flex;align-items:center;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .cv{margin-left:auto;color:var(--tx3)}
.gr .cv svg.i{width:15px;height:15px}
.lk{color:var(--navy);font-weight:600;margin-left:auto}
.lk:hover{text-decoration:underline}
.ntx{padding:8px 14px 10px;font-size:13.5px;line-height:1.45;border-bottom:1px solid var(--line2)}
.ntx small{display:block;color:var(--tx3);font-size:12px;margin-top:3px}
.nin{display:flex;gap:6px;margin:10px}
.nin input{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;outline:none}
.nin input:focus{border-color:#9FB6CF}
.tg2{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 12px}
.tg2 .ch{cursor:default}
.tg2 .ch button{display:grid;place-items:center;margin-right:-3px;color:inherit;opacity:.7}
.tg2 .ch button:hover{opacity:1}
.tg2 .add{font-size:12.5px;color:var(--tx2);display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:6px;border:1px dashed #B7C1CE}
.tg2 .add svg.i{width:13px;height:13px}
.callc{background:var(--navy);color:#fff;border-radius:14px;padding:14px}
.callc .k{font-size:12.5px;opacity:.75;display:flex;align-items:center;gap:6px}
.callc .k svg.i{width:14px;height:14px}
.callc b{display:block;font-size:20px;font-weight:600;margin-top:4px}
.callc .s{font-size:13px;opacity:.85;margin-top:2px}
.callc.done{background:var(--soft);color:var(--tx)}
.outc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;background:#fff;text-align:left}
.oc:hover{background:var(--soft)}
.oc svg.i{width:17px;height:17px;color:var(--tx2)}
.oc.g svg.i{color:var(--g)}.oc.r svg.i{color:var(--r)}.oc.a svg.i{color:var(--a)}
.lbl{font-size:12.5px;font-weight:600;color:var(--tx3);margin-bottom:8px}
.cl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left;font-size:13.5px}
.cl:hover{background:#EEF2F6}
.cl:last-child{border-bottom:0}
.cl .tm{font-weight:600;width:48px;flex:none}
.cl small{display:block;color:var(--tx3);font-size:12px}
/* rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.rail .sep{width:22px;height:1px;background:#D5DBE3;margin:6px 0}
/* dropdowns, menus */
.dd{position:fixed;background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;z-index:70;min-width:200px;max-height:70vh;overflow-y:auto}
.ddh{padding:12px 16px 4px;font-size:12.5px;font-weight:600;color:var(--tx3)}
.ddr{display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:14px;width:100%;text-align:left}
.ddr:hover{background:var(--hover)}
.ddr.on{background:var(--sel)}
.ddr b{display:block;font-weight:600}
.ddr span.s{display:block;font-size:12.5px;color:var(--tx3)}
.ddr .e{margin-left:auto;color:var(--tx3)}
.ddr .e svg.i{width:16px;height:16px}
.ddr.off{opacity:.5;cursor:default}
.ddr.off:hover{background:none}
.ddf{border-top:1px solid var(--line);padding:12px 16px;font-size:13px;color:var(--navy);font-weight:600;display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.ddf:hover{background:var(--hover)}
.ddf svg.i{width:16px;height:16px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:12px}
.ap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:12px;font-size:13px;font-weight:500}
.ap:hover{background:var(--hover)}
.ap.on{background:var(--sel)}
.ap i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.ap i svg.i{width:24px;height:24px}
/* modal */
.veil{position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:50;display:grid;place-items:center}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.shake{animation:sh .32s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.mh{display:flex;align-items:flex-start;padding:22px 22px 10px 26px}
.mh h3{margin:0;font-size:21px;font-weight:600}
.mh span{font-size:13.5px;color:var(--tx3)}
.mh .ib{margin-left:auto;margin-top:-6px}
.mb{display:grid;grid-template-columns:250px 1fr;gap:24px;padding:10px 26px 18px;overflow-y:auto}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.opt:hover{border-color:#B9C4D2}
.opt.on{border-color:var(--navy);background:var(--sel)}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{display:block;font-size:12px;color:var(--tx3)}
.opt .ck{margin-left:auto;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.opt .ck svg.i{width:13px;height:13px;stroke-width:2.6}
.opt .ck0{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid #B9C2CF}
.calh{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-bottom:6px;text-transform:none}
.calh .ib{width:30px;height:30px}
.calh .ib svg.i{width:16px;height:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{font-size:11.5px;color:var(--tx3);font-weight:600;height:24px;line-height:24px}
.cal .d{height:36px;line-height:36px;border-radius:10px;font-size:13.5px;position:relative}
.cal button.d:hover{background:var(--hover)}
.cal .d.x{color:#B8C0CC;cursor:default}
.cal .d.t{box-shadow:inset 0 0 0 1.5px var(--cel);font-weight:600}
.cal .d.s,.cal button.d.s:hover{background:var(--navy);color:#fff;font-weight:600}
.cal .d .dt{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--dot)}
.cal .d.s .dt{background:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sl{height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:500}
.sl:hover{border-color:#9FB6CF}
.sl.oc2{background:repeating-linear-gradient(135deg,#F1F3F6 0 6px,#E8EBF0 6px 12px);color:#9AA4B2;border-color:#E8EBF0;text-decoration:line-through;cursor:not-allowed}
.sl.past{color:#C0C7D2;cursor:not-allowed;border-color:var(--line2)}
.sl.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mf{display:flex;align-items:center;gap:12px;padding:14px 22px 18px 26px;border-top:1px solid var(--line);background:var(--soft)}
.mf .sum{display:flex;align-items:center;gap:10px;font-size:14px}
.mf .sum svg.i{color:var(--navy)}
.mf .sum b{font-weight:600}
.mf .sum small{display:block;color:var(--tx3);font-size:12.5px;margin-top:1px}
.mf .r{margin-left:auto;display:flex;gap:8px}
.cbx{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin-top:12px;text-align:left}
.cbx i{width:18px;height:18px;border-radius:5px;background:var(--navy);display:grid;place-items:center;color:#fff;flex:none}
.cbx i.off{background:#fff;border:1.5px solid #A7B1C0}
.cbx i svg.i{width:12px;height:12px;stroke-width:2.8}
.msgp{font-size:13px;color:var(--tx2);line-height:1.45;background:var(--soft);border-radius:12px;padding:10px 12px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--tx3);margin-bottom:6px}
.fld input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none;font-size:14px}
.fld input:focus{border-color:#9FB6CF}
/* home */
.home{overflow-y:auto;padding:28px 0}
.hw{width:min(1120px,calc(100% - 48px));margin:0 auto}
.hw h1{font-size:34px;font-weight:600;margin:6px 0 4px;letter-spacing:-.4px}
.hw .sub{color:var(--tx3);font-size:16px}
.hs{font-size:14px;font-weight:600;color:var(--tx2);margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hc{background:#fff;border-radius:18px;padding:18px 18px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;text-align:left}
button.hc:hover{border-color:#B9C4D2;box-shadow:0 2px 8px rgba(16,24,40,.06)}
.hc .tp{display:flex;align-items:center;gap:12px}
.hc .tp b{display:block;font-size:16px;font-weight:600}
.hc .tp span{display:block;font-size:13px;color:var(--tx3)}
.hc .ft{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);border-top:1px solid var(--line2);padding-top:12px}
.hc .ft em{margin-left:auto;color:var(--navy);font-weight:600;display:flex;align-items:center;gap:5px;font-style:normal}
.hc .ft em svg.i{width:15px;height:15px}
.hc.off{opacity:.6;cursor:default}
.hg4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.hc.t{flex-direction:row;align-items:center;gap:14px}
.hc.t i{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.hc.t i svg.i{width:22px;height:22px}
.hc.t b{display:block;font-size:15px;font-weight:600}
.hc.t span{display:block;font-size:12.5px;color:var(--tx3)}
/* contactos */
.ctop{display:flex;align-items:center;gap:10px;padding:20px 24px 14px}
.ctop h2{margin:0;font-size:22px;font-weight:600}
.ctop .cn{color:var(--tx3);font-size:14px;margin-left:4px;margin-top:4px}
.ctop .r{margin-left:auto;display:flex;gap:8px}
.ctb2{display:flex;align-items:center;gap:8px;padding:0 24px 14px;border-bottom:1px solid var(--line)}
.ddb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:#fff}
.ddb:hover{background:var(--soft)}
.ddb svg.i{width:15px;height:15px;color:var(--tx3)}
.fchip{height:32px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;font-size:13px;overflow:hidden;background:#fff}
.fchip>*{padding:0 10px;height:100%;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line)}
.fchip>*:last-child{border-right:0}
.fchip .k{color:var(--tx2)}.fchip .o{color:var(--tx3)}
.fchip svg.i{width:14px;height:14px;color:var(--tx3)}
.csrch{display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;margin-left:auto;width:240px}
.csrch input{border:0;outline:none;flex:1;font-size:13px;background:transparent}
.csrch svg.i{width:15px;height:15px;color:var(--tx3)}
.tw{flex:1;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:#fff;height:40px;text-align:left;font-weight:600;color:var(--tx3);font-size:12.5px;border-bottom:1px solid var(--line);padding:0 14px;white-space:nowrap;z-index:1}
.tbl td{height:46px;border-bottom:1px solid var(--line2);padding:0 14px;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl td.nmc{font-weight:600}
.tbl td .in{display:flex;align-items:center;gap:10px}
.cb{width:16px;height:16px;border:1.5px solid #A7B1C0;border-radius:4px;display:inline-block;vertical-align:middle;position:relative;flex:none}
.cb.on{background:var(--navy);border-color:var(--navy)}
.cb.on:after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cfg{padding:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;overflow-y:auto}
.cfg .hc{cursor:default}
/* toast, transition, proto bar */
.toast{position:fixed;left:50%;top:8px;transform:translateX(-50%) translateY(-12px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:all .18s ease-out;z-index:80;box-shadow:var(--shadow);max-width:560px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:var(--cel);font-weight:600}
.trans{position:fixed;inset:0;background:rgba(244,246,248,.92);display:grid;place-items:center;z-index:90;font-size:15px;color:var(--tx2)}
.trans div{display:flex;flex-direction:column;align-items:center;gap:14px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #D6DEE8;border-top-color:var(--navy);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.pbar{position:fixed;left:12px;bottom:12px;width:228px;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(16,24,40,.12);padding:6px 6px 6px 12px;font-size:12.5px;color:var(--tx2)}
.pbar b{color:var(--navy);font-weight:600;margin-right:4px}
.pbar .ddb{height:30px}
.kb{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;padding:8px 26px 24px;font-size:14px;align-items:center}
.kb kbd{font-family:inherit;font-size:12.5px;font-weight:600;min-width:28px;height:26px;padding:0 8px;display:inline-grid;place-items:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;background:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const MIN=60000,H=60*MIN,D=24*H;

const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const sameDay=(a,b)=>{a=new Date(a);b=new Date(b);return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()};
const startDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function rel(t){const n=NOW(),df=n-t;if(df<MIN)return 'recién';if(df<H)return 'hace '+Math.floor(df/MIN)+' min';if(sameDay(t,n))return 'hace '+Math.floor(df/H)+' h';const dd=Math.round((startDay(n)-startDay(t))/D);if(dd==1)return 'ayer';if(dd<7)return 'hace '+dd+' días';const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function dayLabel(t){const n=NOW();const dd=Math.round((startDay(t)-startDay(n))/D);const d=new Date(t);const base=DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];if(dd==0)return 'Hoy · '+base;if(dd==1)return 'Mañana · '+base;if(dd==-1)return 'Ayer · '+base;return base.charAt(0).toUpperCase()+base.slice(1)}
function shortWhen(t){const n=NOW();const dd=Math.round((startDay(t)-startDay(n))/D);if(dd==0)return 'hoy '+hhmm(t);if(dd==1)return 'mañana '+hhmm(t);return DIAS3[new Date(t).getDay()]+' '+new Date(t).getDate()+', '+hhmm(t)}

  if(S.screen=='home'){app.innerHTML=`<div class="app">${topbar(true)}<div class="home" id="home">${home()}</div></div>`+pbar();return}
  const card=S.screen=='inbox'?`<div class="card ${S.sideOpen?'wside':''}" id="card"><div class="list" id="list">${list()}</div><div class="thread" id="thread">${thread()}</div>${S.sideOpen?`<div class="side" id="side">${side()}</div>`:''}</div>`
    :S.screen=='contactos'?`<div class="card full">${contactos()}</div>`:`<div class="card full">${config()}</div>`;
  app.innerHTML=`<div class="app">${topbar()}<div class="body ${S.navC?'nc':''}"><nav class="nav" id="nav">${nav()}</nav>${card}<div class="rail">${rail()}</div></div></div>`+pbar();
  scrollThread();
}
function rerender(parts){ // render parcial que conserva el composer
  const ta=document.getElementById('ta'),val=ta?ta.value:null,foc=document.activeElement&&document.activeElement.id;
  if(S.screen!='inbox'){render();return}
  for(const p of parts){const el=document.getElementById(p);if(!el){render();return}
    if(p=='list')el.innerHTML=list();if(p=='nav')el.innerHTML=nav();if(p=='side')el.innerHTML=side();if(p=='thread'){el.innerHTML=thread();scrollThread()}}
  const ta2=document.getElementById('ta');if(ta2&&val!=null&&!parts.includes('thread')){ta2.value=val}
  if(foc=='ta'&&ta2)ta2.focus();
}
function scrollThread(){const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
function topbar(home){
  const u=ME(),nm=home?'Matías':uname(u);
  return `<header class="top">
   <button class="ib" data-a="navToggle" title="Menú">${I('menu')}</button>
   <div class="logo" data-a="goHome"><div class="mark">S</div><span class="prod">${home?'Apps':'Bandejas'}</span></div>
   ${home?'':`<button class="picker ${S.menu=='switch'?'on':''}" data-a="menu" data-m="switch" id="pickerBtn">${bdg(S.b,30)}<div><b>${esc(B().name)}</b><span class="num">${esc(B().number)}</span></div>${I('chevron-down')}</button>`}
   <label class="search" ${home?'style="margin-left:60px"':''}>${I('search')}<input id="q" placeholder="${home?'Buscar una app, bandeja o cliente':'Buscar en '+esc(B().name)}" value="${esc(home?'':S.search)}" autocomplete="off">${home?'':`<span title="Búsqueda avanzada (fuera del prototipo)" data-a="toast" data-t="La búsqueda avanzada queda para la versión real.">${I('sliders-horizontal')}</span>`}</label>
   <div class="tr"><button class="ib" data-a="keys" title="Atajos de teclado">${I('circle-help')}</button><button class="ib" data-a="toast" data-t="Notificaciones: quedan como hoy, se rediseñan en la sesión F." title="Notificaciones">${I('bell')}<span class="bd"></span></button><button class="ib ${S.menu=='apps'?'on':''}" data-a="menu" data-m="apps" id="appsBtn" title="Apps de Saysells">${I('grip')}</button>
   <button class="me" style="background:${PAL[hash(nm)%PAL.length][0]};color:${PAL[hash(nm)%PAL.length][1]}" data-a="toast" data-t="Sesión de ${esc(nm)} en ${esc(home?'apps.saysells.com':B().domain)}." title="${esc(nm)}">${esc(inis(nm))}</button></div>
  </header>`;
}
const bdg=(k,s)=>{const b=BANDEJAS[k].badge;return `<div class="bdg" style="background:${b[1]};width:${s}px;height:${s}px">${b[0]}</div>`};
function nav(){
  const v=VIEWS();
  const g=funnelGroups().map(x=>{const n=B().convs.filter(c=>!c.closed&&GROUP(c.state)==x).length;return `<button class="ni ${S.funnel==x&&!S.search?'on':''}" data-a="funnel" data-f="${esc(x)}" title="${esc(x)}"><span class="sq" style="background:${GCOL[x][0]}"></span><span class="l">${esc(x)}</span><span class="c num">${n||''}</span></button>`}).join('');
  return `<button class="compose" data-a="newMsg" title="Nuevo mensaje">${I('square-pen')}<span>Nuevo mensaje</span></button>
   ${v.map(([k,ic,l])=>`<button class="ni ${S.screen=='inbox'&&S.view==k&&!S.funnel&&!S.search?'on':''}" data-a="view" data-v="${k}" title="${l}">${I(ic)}<span class="l">${l}</span><span class="c num ${k=='free'&&viewCount('free')?'o':''}">${viewCount(k)}</span></button>`).join('')}
   <div class="ns">Embudo</div>${g}
   <div class="ns">Herramientas</div>
   <button class="ni ${S.screen=='contactos'?'on':''}" data-a="screen" data-s="contactos" title="Contactos">${I('users')}<span class="l">Contactos</span></button>
   <button class="ni ${S.screen=='config'?'on':''}" data-a="screen" data-s="config" title="Configuración">${I('settings')}<span class="l">Configuración</span></button>`;
}
function row(c){
  const lm=lastMsg(c),w=win(c),me=ME();
  let pv=lm?esc(lm.text.replace(/\n/g,' ')):'';
  if(lm&&lm.dir=='out')pv='<b>Vos:</b> '+pv;else if(lm&&lm.dir=='bot')pv='<b>Bot:</b> '+pv;else if(lm&&lm.dir=='note')pv='<b>Nota:</b> '+pv;
  const call=c.call&&!c.call.result?`<span class="ch s">${I('calendar-clock')}${esc(uname(c.call.closer))} · ${shortWhen(c.call.at)}</span>`:'';
  const wc=!c.closed&&w.k=='a'?`<span class="ch a" data-wl="${c.id}">${I('hourglass')}Vence en ${dur(w.rem)}</span>`:(!c.closed&&w.k=='r'&&c.state!='Ganada'&&c.state!='Perdido'?`<span class="ch o">${I('lock')}Ventana cerrada</span>`:'');
  const who=c.setter?`<span class="who" title="Setter: ${esc(uname(c.setter))}">${mini(uname(c.setter))}</span>`:`<span class="who" title="Sin tomar">${FREE}</span>`;
  return `<button class="row ${S.sel==c.id?'sel':''} ${c.unread?'un':''}" data-a="open" data-c="${c.id}">${av(c.name,42)}<div class="rm">
   <div class="r1"><span class="nm">${esc(c.name)}</span><span class="t num">${rel(lastT(c))}</span></div>
   <div class="r2"><span class="pv">${pv}</span>${c.unread?`<span class="cnt num">${c.unread}</span>`:''}</div>
   <div class="r3">${chip(c.state)}${call}${wc}${who}</div></div></button>`;
}
const mini=n=>av(n,22);
function callRow(c){
  const t=c.call.at,n=NOW();let st;
  if(c.call.result)st=`<span class="ch g">${I('circle-check')}${esc(c.call.result)}</span>`;
  else if(t<n)st=`<span class="ch a">${I('circle-alert')}Sin resultado</span>`;
  else if(t-n<3*H)st=`<span class="ch s">${I('clock')}En ${dur(t-n)}</span>`;
  else st=`<span class="ch o">${I('calendar-clock')}Agendada</span>`;
  return `<button class="row ${S.sel==c.id?'sel':''}" data-a="open" data-c="${c.id}" style="align-items:center"><div style="width:50px;flex:none"><div class="num" style="font-size:16px;font-weight:600">${hhmm(t)}</div></div>${av(c.name,40)}<div class="rm"><div class="r1"><span class="nm" style="font-weight:600">${esc(c.name)}</span></div><div class="r2"><span class="pv">${esc(c.biz||c.phone)} · setter ${esc(uname(c.setter))}</span></div><div class="r3">${st}</div></div></button>`;
}
function list(){
  const L=listConvs(),title=viewTitle();
  let body='';
  const free=B().convs.filter(c=>!c.closed&&!c.setter).sort((a,b)=>a.msgs[0].t-b.msgs[0].t);
  const take=(S.view=='mine'&&!S.funnel&&!S.search&&free.length)?`<div class="take">${I('user-round-plus')}<div><b>${free.length} ${free.length==1?'consulta':'consultas'} sin tomar</b><span>La más antigua, ${rel(free[0].msgs[0].t)}</span></div><button class="btn sm" data-a="takeNext">Tomar siguiente</button></div>`:'';
  if(!L.length){
    const e=S.view=='free'?['user-round-check','No hay consultas sin tomar','Cuando entre una consulta nueva aparece acá, con el contador en naranja.']:S.view=='calls'?['calendar-check','No tenés llamadas agendadas','Cuando un setter te agende una llamada, aparece acá.']:B().convs.length==0?['messages-square','Todavía no hay conversaciones','Cuando alguien le escriba a este número, aparece acá. La bandeja queda lista para cuando se use.']:['inbox','Nada por acá','No hay conversaciones en esta vista.'];
    body=`<div class="empty"><div class="ei">${I(e[0])}</div><b>${e[1]}</b>${e[2]}</div>`;
  } else if(S.view=='calls'&&!S.funnel&&!S.search){
    const groups={};L.forEach(c=>{const k=startDay(c.call.at);(groups[k]=groups[k]||[]).push(c)});
    body=Object.keys(groups).sort((a,b)=>a-b).map(k=>`<div class="sec"><span>${dayLabel(+k)}</span><span class="num">${groups[k].length}</span></div>${groups[k].map(callRow).join('')}`).join('');
  } else if(!S.search&&!S.funnel&&['mine','all'].includes(S.view)){
    const un=L.filter(c=>c.unread),rd=L.filter(c=>!c.unread);
    body=(un.length?`<div class="sec"><span>Sin leer</span><span class="num">${un.length}</span></div>${un.map(row).join('')}`:'')+(rd.length?`<div class="sec" ${un.length?'style="margin-top:6px"':''}><span>${un.length?'Leídas':'Conversaciones'}</span><span class="num">${rd.length}</span></div>${rd.map(row).join('')}`:'');
  } else body=L.map(row).join('');
  const cnt=S.view=='calls'&&!S.funnel&&!S.search?(callCount()+' por hacer'):(L.length+(L.length==1?' conversación':' conversaciones'));
  return `<div class="lh"><h2>${esc(title)}</h2><span class="cn num">${cnt}</span></div>${take}<div class="lsc">${body}</div>`;
}
function primaryAction(c){
  if(c.closed)return `<button class="btn" data-a="reopen">${I('rotate-ccw')}Reabrir</button>`;
  if(ISCLOSER()&&c.call&&c.call.closer==ME())return `<button class="btn" data-a="proposal">${I('file-signature')}Crear propuesta${I('arrow-up-right')}</button>`;
  if(!B().closers.length)return '';
  if(c.call&&!c.call.result)return `<button class="btn" data-a="schedule" title="Tecla L">${I('calendar-clock')}${esc(uname(c.call.closer))} · ${shortWhen(c.call.at)}</button>`;
  return `<button class="btn p" data-a="schedule" title="Tecla L">${I('calendar-plus')}Agendar llamada</button>`;
}
function thread(){
  const c=conv(S.sel);
  if(!c)return `<div class="nosel"><div class="empty"><div class="ei">${I('messages-square')}</div><b>Elegí una conversación</b>Usá J y K para moverte por la lista.</div></div>`;
  let lastDay=0,html='';
  c.msgs.forEach(m=>{
    if(!sameDay(m.t,lastDay)){lastDay=m.t;html+=`<span class="day">${sameDay(m.t,NOW())?'Hoy':dayLabel(m.t).replace(/^Ayer · .*/,'Ayer')}</span>`}
    if(m.dir=='ev')html+=`<div class="ev">${I(/agend/.test(m.text)?'calendar-check':/tomó|traspasó/.test(m.text)?'user-round-check':'circle-check')}<span class="num">${hhmm(m.t)}</span> · ${esc(m.text)}</div>`;
    else if(m.dir=='note')html+=`<div class="note"><div class="h">${I('sticky-note')}Nota interna · ${esc(m.by||'')}</div>${esc(m.text)}</div>`;
    else if(m.dir=='in')html+=`<div class="bb in">${esc(m.text)}<div class="mt num">${hhmm(m.t)}</div></div>`;
    else html+=`${m.dir=='bot'?`<div class="lab">${I('bot')}Bot de bienvenida</div>`:m.tpl?`<div class="lab">${I('file-text')}Plantilla · ${esc(m.tpl)}</div>`:''}<div class="bb out">${esc(m.text)}<div class="mt num">${hhmm(m.t)} ${I(m.sent===false?'check':'check-check')}</div></div>`;
  });
  return `<div class="th">${av(c.name,42)}<div class="nm"><b>${esc(c.name)}</b><span class="num">${esc(c.biz?c.biz+' · ':'')}${esc(c.phone)}</span></div>
   <div class="act">${primaryAction(c)}${c.closed?'':`<button class="ib" data-a="close" title="Cerrar conversación (E)">${I('circle-check')}</button>`}<button class="ib" data-a="menu" data-m="more" id="moreBtn" title="Más">${I('ellipsis')}</button></div></div>
   <div class="msgs" id="msgs"><div class="sp"></div>${html}</div>${composer(c)}`;
}
function winText(c){const w=win(c);if(w.k=='g')return `<span class="win g" data-w="${c.id}"><span class="d"></span>Ventana abierta · quedan ${dur(w.rem)}</span>`;if(w.k=='a')return `<span class="win a" data-w="${c.id}"><span class="d"></span>La ventana vence en ${dur(w.rem)}</span>`;if(w.k=='r')return `<span class="win r" data-w="${c.id}"><span class="d"></span>Ventana cerrada hace ${dur(w.since)}</span>`;return `<span class="win r"><span class="d"></span>Sin respuesta del cliente todavía</span>`}
function composer(c){
  const w=win(c);
  const tabs=`<div class="cbar"><button class="tab ${S.tab=='reply'?'on':''}" data-a="tab" data-t="reply">Responder</button><button class="tab ${S.tab=='note'?'on':''}" data-a="tab" data-t="note">Nota interna</button>${S.tab=='reply'?winText(c):''}</div>`;
  if(S.tab=='reply'&&(w.k=='r'||w.k=='none')){
    const T=B().templates,sel=T[S.tpl]||T[0];
    const prev=sel?sel[2].replace('{nombre}',firstName(c)):'';
    return `<div class="cmp">${tabs}<div class="tplc"><div class="hd ${w.k=='none'?'w':''}">${I('lock')}<div><b>${w.k=='none'?firstName(c)+' todavía no respondió':'Pasaron 24 h desde el último mensaje de '+esc(firstName(c))}</b>WhatsApp solo deja escribirle con una plantilla aprobada por Meta.</div></div>
     <div class="bd2"><div class="tl">${T.map((t,i)=>`<button class="it ${i==S.tpl?'on':''}" data-a="tpl" data-i="${i}">${I('file-text')}${esc(t[0])}<small>${t[1]}</small></button>`).join('')}</div>
     <div class="tpv"><span style="font-size:12.5px;color:var(--tx3);font-weight:600">Vista previa</span><div class="bb out">${esc(prev)}</div><div class="row2"><button class="btn p sm" data-a="sendTpl">${I('send-horizontal')}Enviar plantilla</button></div></div></div></div></div>`;
  }
  const warn=S.tab=='reply'&&w.k=='a'?`<div class="warn">${I('hourglass')}Después de las ${hhmm(w.until)} solo vas a poder escribirle con una plantilla aprobada.</div>`:'';
  const ph=S.tab=='note'?'Escribí una nota para el equipo… (el cliente no la ve)':`Escribí a ${firstName(c)}…  / para respuestas rápidas`;
  return `<div class="cmp">${S.qr?qrPop():''}${tabs}${warn}<div class="cbox ${S.tab=='note'?'note':''}"><textarea id="ta" placeholder="${esc(ph)}">${esc(S.draft[c.id]||'')}</textarea>
   <div class="ctb"><button class="ib" data-a="toast" data-t="Adjuntar archivos funciona igual que hoy; no está en el prototipo." title="Adjuntar">${I('paperclip')}</button><button class="ib" data-a="slash" title="Respuestas rápidas">${I('message-square-text')}</button><button class="ib" data-a="tplTab" title="Plantillas">${I('file-text')}</button>${S.tab=='reply'?`<button class="sug" data-a="suggest">${I('sparkles')}Sugerir respuesta</button>`:''}<span class="hint">Enter envía · Shift + Enter, nueva línea</span><button class="send" data-a="send" title="Enviar">${I('send-horizontal')}</button></div></div></div>`;
}
function qrPop(){const items=qrItems();return `<div class="qr"><div class="h">Respuestas rápidas</div>${items.length?items.map((q,i)=>`<button class="it ${i==S.qr.i?'on':''}" data-a="qrPick" data-i="${i}"><b>${esc(q[0])}</b><span>${esc(q[1].replace(/\n/g,' '))}</span></button>`).join(''):'<div style="padding:10px 14px;color:var(--tx3);font-size:13px">Sin coincidencias</div>'}</div>`}
function qrItems(){const f=(S.qr&&S.qr.f||'').toLowerCase();return B().quick.filter(q=>q[0].includes('/'+f.replace(/^\//,''))||q[1].toLowerCase().includes(f.replace(/^\//,'')))}
function side(){
  const c=conv(S.sel);
  const close=`<button class="ib" data-a="sideClose" title="Cerrar panel">${I('x')}</button>`;
  if(S.sideTab=='calls'){
    const L=B().convs.filter(x=>x.call&&!x.call.result).sort((a,b)=>a.call.at-b.call.at);

    ${c.call.result?'':`<div class="lbl" style="margin:4px 2px -4px">Después de la llamada</div><div class="outc"><button class="oc g" data-a="outcome" data-o="Realizada">${I('circle-check')}Realizada</button><button class="oc a" data-a="reschedule">${I('calendar-clock')}Reagendar</button><button class="oc r" data-a="outcome" data-o="No se presentó">${I('calendar-x')}No se presentó</button><button class="oc" data-a="outcome" data-o="Propuesta">${I('file-signature')}Propuesta</button></div>`}`;
  } else {
    top=`<div class="idt">${av(c.name,72)}<b>${esc(c.name)}</b><span>${esc(c.biz||'Sin empresa')}</span>
     <div class="qa"><button data-a="toast" data-t="En la versión real abre la llamada al ${esc(c.phone)}."><i>${I('phone')}</i>Llamar</button><button data-a="copy" data-v="${esc(c.phone)}"><i>${I('copy')}</i>Copiar</button><button data-a="toast" data-t="Sin email cargado en este contacto."><i>${I('mail')}</i>Email</button></div></div>`;
  }
  const callRowH=B().closers.length?`<div class="gr"><span class="k">Llamada</span>${c.call&&!c.call.result?`<span class="v" style="white-space:normal;line-height:1.25">${mini(uname(c.call.closer))}<span>${esc(uname(c.call.closer))}<br><small style="color:var(--tx3);font-size:12px">${shortWhen(c.call.at)}</small></span></span><button class="lk" data-a="schedule">Cambiar</button>`:`<span class="v" style="color:var(--tx3)">Sin agendar</span><button class="lk" data-a="schedule">Agendar</button>`}</div>`:'';
  const simple=c.tags.length||B().simple.length?`<div class="grp"><div class="gt">Etiquetas</div><div class="tg2">${c.tags.map(t=>`<span class="ch o">${esc(t=='origen_ads'?'Origen: anuncio':t=='origen_form'?'Origen: formulario':t)}<button data-a="untag" data-t="${esc(t)}" title="Quitar">${I('x')}</button></span>`).join('')}<button class="add" data-a="menu" data-m="tags" id="tagsBtn">${I('plus')}Agregar</button></div></div>`:'';
  return `<div class="sh"><h3>${closerCard?'Llamada':'Ficha'}</h3>${close}</div><div class="sb">${top}
   <div class="grp"><div class="gt">Embudo</div>
    <button class="gr" data-a="menu" data-m="state" id="stateBtn"><span class="k">Estado</span><span class="v">${chip(c.state)}</span><span class="cv">${I('chevron-down')}</span></button>
    <button class="gr" data-a="menu" data-m="setter" id="setterBtn"><span class="k">Setter</span><span class="v">${c.setter?mini(uname(c.setter))+esc(uname(c.setter)):`${FREE}<span style="color:var(--tx3)">Sin tomar</span>`}</span><span class="cv">${I('chevron-down')}</span></button>
    ${callRowH}</div>
   ${simple}
   <div class="grp"><div class="gt">Origen</div><div class="gr"><span class="k">Llegó por</span><span class="v">${esc(c.origin||'Orgánico')}</span></div><div class="gr"><span class="k">Primer mensaje</span><span class="v num">${shortWhen(c.msgs[0].t)}</span></div></div>
   ${notes}</div>`;
}
function rail(){const it=[['ficha','user','Ficha'],['calls','calendar-clock','Llamadas'],['notes','sticky-note','Notas'],['props','file-signature','Propuestas']];return it.map(([k,ic,l])=>`<button class="ib ${S.sideOpen&&S.sideTab==k&&S.screen=='inbox'?'on':''}" data-a="sideTab" data-t="${k}" title="${l}">${I(ic)}</button>`).join('')+`<div class="sep"></div><button class="ib" data-a="toast" data-t="Acá se suman otras herramientas al panel lateral." title="Agregar">${I('plus')}</button>`}

function placeMenu(anchorId,html,w,alignRight){
  const a=document.getElementById(anchorId);if(!a)return;
  const r=a.getBoundingClientRect();
  ov.innerHTML=`<div class="dd" id="dd" style="width:${w}px">${html}</div>`;
  const dd=document.getElementById('dd');
  let left=alignRight?r.right-w:r.left,topY=r.bottom+6;
  if(left+w>innerWidth-8)left=innerWidth-w-8;
  dd.style.left=Math.max(8,left)+'px';
  const h=dd.offsetHeight;if(topY+h>innerHeight-8)topY=Math.max(8,r.top-h-6);
  dd.style.top=topY+'px';
}

function modal(html){ov.innerHTML=`<div class="veil" id="veil">${html}</div>`}

function openSchedule(mode){
  const c=conv(S.sel);if(!c)return;
  if(!B().closers.length){toast('Esta bandeja no tiene etiquetas con fecha: no se agendan llamadas desde acá.');return}
  const cur=c.call&&!c.call.result?c.call:null;
  const base=cur?new Date(cur.at):new Date(NOW()+2*D);
  S.modal={k:'sched',mode:mode||(cur?'re':'new'),closer:cur?cur.closer:(ISCLOSER()?ME():B().closers[0][0]),y:base.getFullYear(),m:base.getMonth(),day:cur?startDay(cur.at):null,slot:cur?hhmm(cur.at):null,confirm:true};
  drawSchedule();
}
const SLOTS=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30'];
function busy(closer,day,excl){return B().convs.filter(x=>x.id!=excl&&x.call&&!x.call.result&&x.call.closer==closer&&sameDay(x.call.at,day)).map(x=>hhmm(x.call.at))}
function drawSchedule(){
  const st=S.modal,c=conv(S.sel);
  const first=new Date(st.y,st.m,1),offset=(first.getDay()+6)%7,days=new Date(st.y,st.m+1,0).getDate();
  const today=startDay(NOW());
  let cells=['L','M','M','J','V','S','D'].map(x=>`<div class="w">${x}</div>`).join('');
  for(let k=0;k<offset;k++)cells+='<div class="d x"></div>';
  for(let d=1;d<=days;d++){const t=new Date(st.y,st.m,d).getTime();const past=t<today;const has=busy(st.closer,t,c.id).length;
    cells+=past?`<div class="d x num">${d}</div>`:`<button class="d num ${t==today?'t':''} ${st.day==t?'s':''}" data-a="schDay" data-d="${t}">${d}${has?'<span class="dt"></span>':''}</button>`}
  const occ=st.day?busy(st.closer,st.day,c.id):[];
  const slots=st.day?SLOTS.map(s=>{const[h,m]=s.split(':').map(Number);const t=st.day+h*H+m*MIN;const past=t<NOW();const o=occ.includes(s);return `<button class="sl num ${o?'oc2':''} ${past?'past':''} ${st.slot==s?'on':''}" ${o||past?'disabled':''} data-a="schSlot" data-s="${s}" title="${o?'Ocupado':past?'Ya pasó':''}">${s}</button>`}).join(''):'';
  const closers=B().closers.map(([k,n])=>{const cnt=B().convs.filter(x=>x.call&&!x.call.result&&x.call.closer==k&&x.call.at>=startDay(NOW())&&x.call.at<startDay(NOW())+7*D).length;return `<button class="opt ${st.closer==k?'on':''}" data-a="schCloser" data-k="${k}">${av(n,36)}<div><b>${esc(n)}</b><span>${cnt} ${cnt==1?'llamada':'llamadas'} en los próximos 7 días</span></div>${st.closer==k?`<span class="ck">${I('check')}</span>`:'<span class="ck0"></span>'}</button>`}).join('');
  const when=st.day&&st.slot?new Date(st.day+(+st.slot.slice(0,2))*H+(+st.slot.slice(3))*MIN):null;
  const cn=uname(st.closer);
  const msg=when?`¡Listo ${firstName(c)}! Te agendé con ${cn} el ${DIAS[when.getDay()]} ${when.getDate()} a las ${st.slot}. Te llama a este número.`:'';
  modal(`<div class="modal" id="mdl" style="width:780px" role="dialog" aria-modal="true">
   <div class="mh"><div><h3>${st.mode=='re'?'Reagendar llamada':'Agendar llamada'}</h3><span>${esc(c.name)}${c.biz?' · '+esc(c.biz):''}</span></div><button class="ib" data-a="closeModal" title="Cerrar">${I('x')}</button></div>
   <div class="mb"><div><div class="lbl">Closer</div>${closers}
     <div class="lbl" style="margin-top:18px">Mensaje para ${esc(firstName(c))}</div><div class="msgp">${when?esc('“'+msg+'”'):'Elegí día y horario para armar el mensaje.'}</div>
     <button class="cbx" data-a="schConfirm"><i class="${st.confirm?'':'off'}">${st.confirm?I('check'):''}</i>Dejarlo listo en el composer</button></div>
    <div><div class="calh">${MESES[st.m]} ${st.y}<span style="margin-left:auto"></span><button class="ib" data-a="schMonth" data-d="-1" title="Mes anterior">${I('chevron-left')}</button><button class="ib" data-a="schMonth" data-d="1" title="Mes siguiente">${I('chevron-right')}</button></div>
     <div class="cal">${cells}</div>
     <div class="lbl" style="margin-top:14px">${st.day?'Horario · '+DIAS[new Date(st.day).getDay()]+' '+new Date(st.day).getDate():'Horario'}</div>
     ${st.day?`<div class="slots">${slots}</div>`:'<div style="font-size:13px;color:var(--tx3)">Elegí un día. Los puntos naranjas marcan días con llamadas de '+esc(cn)+'.</div>'}</div></div>
   <div class="mf"><div class="sum">${I('calendar-check')}<div>${when?`<b>${DIAS[when.getDay()].replace(/^./,x=>x.toUpperCase())} ${when.getDate()} de ${MESES[when.getMonth()]}, ${st.slot}</b><small>con ${esc(cn)} · la ve en Mis llamadas y en el CRM</small>`:'<b>Sin fecha todavía</b><small>Closer, día y horario</small>'}</div></div><div class="r"><button class="btn" data-a="closeModal">Cancelar</button><button class="btn p" data-a="schSave" ${when?'':'disabled'}>${st.mode=='re'?'Reagendar':'Agendar llamada'}</button></div></div></div>`);
}
function saveSchedule(){
  const st=S.modal,c=conv(S.sel);if(!st.day||!st.slot)return;
  const t=st.day+(+st.slot.slice(0,2))*H+(+st.slot.slice(3))*MIN;
  const cn=uname(st.closer),me=uname(ME()),w=new Date(t);
  const re=st.mode=='re';
  c.call={closer:st.closer,at:t};
  c.state=re?'Reagendado':(st.closer&&B().states.includes('Agendado a '+cn)?'Agendado a '+cn:'Agendada');
  c.msgs.push(M('ev',`${me} ${re?'reagendó':'agendó'} la llamada con ${cn} para el ${DIAS[w.getDay()]} ${w.getDate()} a las ${st.slot}`,NOW()));
  if(!c.setter&&!ISCLOSER())c.setter=ME();
  if(st.confirm&&win(c).k!='r'&&win(c).k!='none'){S.draft[c.id]=`¡Listo ${firstName(c)}! Te agendé con ${cn} el ${DIAS[w.getDay()]} ${w.getDate()} a las ${st.slot}. Te llama a este número.`;S.tab='reply'}
  closeModal();
  if(S.view=='calls')S.sel=c.id;
  rerender(['nav','list','thread','side']);
  toast(`${re?'Llamada reagendada':'Llamada agendada'} con ${cn}. Por dentro: fecha + etiqueta “${c.state}”; el puente avisa al CRM.`);
  const ta=document.getElementById('ta');if(ta&&S.draft[c.id]){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}
}

/* ---------- acciones ---------- */
let toastTimer;
function toast(t,btn,fn){const el=document.getElementById('toast');document.getElementById('toastT').textContent=t;const b=document.getElementById('toastB');b.textContent=btn||'';b.style.display=btn?'':'none';b.onclick=()=>{fn&&fn();el.classList.remove('on')};el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),btn?6000:3600)}
function openConv(id){
  const c=conv(id);if(!c)return;
  S.sel=id;c.unread=0;S.qr=null;S.tpl=0;
  if(S.sideTab!='ficha'&&S.sideTab!='notes')S.sideTab='ficha';
  rerender(['nav','list','thread','side']);
}
function move(d){const L=listConvs();if(!L.length)return;let i=L.findIndex(c=>c.id==S.sel);i=i<0?0:Math.min(L.length-1,Math.max(0,i+d));openConv(L[i].id)}
function takeNext(){const free=B().convs.filter(c=>!c.closed&&!c.setter).sort((a,b)=>a.msgs[0].t-b.msgs[0].t);if(!free.length){toast('No hay consultas sin tomar.');return}const c=free[0];c.setter=ME();c.msgs.push(M('ev',uname(ME())+' tomó la conversación',NOW()));S.view='mine';S.funnel=null;S.search='';openConv(c.id);render();toast(`Tomaste la consulta de ${c.name}. Por dentro: se asigna a vos, igual que hoy.`)}
function send(){
  const c=conv(S.sel),ta=document.getElementById('ta');if(!c||!ta)return;const v=ta.value.trim();if(!v)return;
  if(S.tab=='note'){c.msgs.push(M('note',v,NOW(),{by:uname(ME())}));c.notes.push([v,uname(ME()),NOW()]);S.draft[c.id]='';rerender(['list','thread','side']);toast('Nota guardada. Solo la ve el equipo.');return}
  const m=M('out',v,NOW(),{sent:false});c.msgs.push(m);S.draft[c.id]='';
  if(!c.setter&&!ISCLOSER()){c.setter=ME();c.msgs.splice(c.msgs.length-1,0,M('ev',uname(ME())+' tomó la conversación',NOW()))}
  S.qr=null;rerender(['nav','list','thread','side']);
  setTimeout(()=>{m.sent=true;if(S.sel==c.id)rerender(['thread'])},1100);
  if(c.auto.length){const r=c.auto.shift();setTimeout(()=>{c.msgs.push(M('in',r,NOW()));if(S.sel!=c.id)c.unread++;rerender(['nav','list','thread']);if(S.sel==c.id)toast(firstName(c)+' respondió. La ventana de 24 h vuelve a empezar.')},5000)}
}
function sendTpl(){const c=conv(S.sel);const t=B().templates[S.tpl];c.msgs.push(M('out',t[2].replace('{nombre}',firstName(c)),NOW(),{tpl:t[0]}));rerender(['list','thread']);toast('Plantilla enviada. La ventana se abre recién cuando el cliente responda.')}
function closeConv(){const c=conv(S.sel);if(!c||c.closed)return;const L0=listConvs(),ix=L0.findIndex(x=>x.id==c.id);c.closed=true;const L=listConvs();const nx=L[Math.min(Math.max(ix,0),L.length-1)];S.sel=nx?nx.id:null;if(nx)nx.unread=0;rerender(['nav','list','thread','side']);toast('Conversación cerrada.','Deshacer',()=>{c.closed=false;S.sel=c.id;rerender(['nav','list','thread','side'])})}
function setState(s){const c=conv(S.sel);if(NEEDS_DATE(s)){closeMenu();const cl=(s.match(/^Agendado a (.+)$/)||[])[1];openSchedule();if(cl){const k=B().closers.find(x=>x[1]==cl);if(k){S.modal.closer=k[0];drawSchedule()}}return}
  c.state=s;if(c.call&&!c.call.result&&!NEEDS_DATE(s))c.call=null;closeMenu();rerender(['nav','list','side']);toast(`Estado: ${s}. El puente lo lleva al CRM, igual que hoy.`)}
function outcome(o){const c=conv(S.sel);c.call.result=o;c.state=o;c.msgs.push(M('ev',`${uname(ME())} registró la llamada: ${o}`,NOW()));rerender(['nav','list','thread','side']);toast(o=='Propuesta'?'Estado: Propuesta. En la versión real se abre propuestas.saysells.com para armarla.':`Llamada registrada como ${o}. El CRM se entera por el puente.`)}
function switchTo(k){
  closeMenu();if(k==S.b&&S.screen!='home'){return}
  const b=BANDEJAS[k];ov.innerHTML=`<div class="trans"><div><div class="spin"></div>Abriendo ${esc(b.domain)}…</div></div>`;
  setTimeout(()=>{S.b=k;S.screen='inbox';S.funnel=null;S.search='';S.view=k=='SE'||k=='USA'?'all':(k=='ARG'&&S.role=='MA'?'calls':'mine');const L=listConvs();S.sel=L[0]?L[0].id:null;if(L[0])L[0].unread=0;ov.innerHTML='';render();
    toast(`Estás en ${b.name}. Por dentro es otra dirección: si no tenés sesión abierta ahí, te pide el usuario.`)},650);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const veil=e.target.id=='veil';
  if(veil){const m=document.getElementById('mdl');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');return}
  const el=e.target.closest('[data-a]');
  if(!el){if(S.menu&&!e.target.closest('.dd'))closeMenu();if(S.qr&&!e.target.closest('.qr')&&!e.target.closest('#ta')){S.qr=null;rerender(['thread'])}return}
  const a=el.dataset.a,c=conv(S.sel),inDD=el.closest('.dd');
  if(a!='menu'&&S.menu&&!el.closest('.dd'))closeMenu();
  switch(a){
   case 'menu': if(S.menu==el.dataset.m){closeMenu()}else{openMenu(el.dataset.m)} break;
   case 'navToggle': S.navC=!S.navC;render();break;
   case 'goHome': closeMenu();S.screen='home';render();break;
   case 'switchTo': switchTo(el.dataset.b);break;
   case 'view': S.screen='inbox';S.view=el.dataset.v;S.funnel=null;S.search='';{const L=listConvs();if(!L.find(x=>x.id==S.sel)){S.sel=L[0]?L[0].id:null;if(L[0])L[0].unread=0}}render();break;
   case 'funnel': S.screen='inbox';S.funnel=el.dataset.f;S.search='';{const L=listConvs();if(!L.find(x=>x.id==S.sel)){S.sel=L[0]?L[0].id:null}}render();break;
   case 'screen': S.screen=el.dataset.s;render();break;
   case 'open': if(S.screen!='inbox'){S.screen='inbox'}openConv(el.dataset.c);if(!document.getElementById('list'))render();break;
   case 'openContact': S.screen='inbox';S.view='all';S.funnel=null;S.search='';S.sel=el.dataset.c;conv(S.sel).unread=0;render();break;
   case 'takeNext': takeNext();break;
   case 'schedule': openSchedule();break;
   case 'reschedule': openSchedule('re');break;
   case 'schCloser': S.modal.closer=el.dataset.k;S.modal.slot=null;drawSchedule();break;
   case 'schDay': S.modal.day=+el.dataset.d;S.modal.slot=null;drawSchedule();break;
   case 'schSlot': S.modal.slot=el.dataset.s;drawSchedule();break;
   case 'schMonth': {const d=new Date(S.modal.y,S.modal.m+ +el.dataset.d,1);S.modal.y=d.getFullYear();S.modal.m=d.getMonth();drawSchedule();break}
   case 'schConfirm': S.modal.confirm=!S.modal.confirm;drawSchedule();break;
   case 'schSave': saveSchedule();break;
   case 'closeModal': closeModal();break;
   case 'close': closeConv();break;
   case 'reopen': c.closed=false;rerender(['nav','list','thread']);toast('Conversación reabierta.');break;
   case 'proposal': toast('En la versión real abre propuestas.saysells.com con los datos de '+(c?c.name:'este contacto')+'.');break;
   case 'outcome': outcome(el.dataset.o);break;
   case 'setState': setState(el.dataset.s);break;
   case 'assign': {const u=el.dataset.u||null;c.setter=u;if(u)c.msgs.push(M('ev',`${uname(ME())} asignó la conversación a ${uname(u)}`,NOW()));closeMenu();rerender(['nav','list','thread','side']);toast(u?`Asignada a ${uname(u)}.`:'La conversación vuelve a Sin tomar.');break}
   case 'tag': c.tags.push(el.dataset.t);closeMenu();rerender(['side']);break;
   case 'untag': c.tags=c.tags.filter(t=>t!=el.dataset.t);rerender(['side']);break;
   case 'unreadMark': c.unread=1;closeMenu();S.sel=null;rerender(['nav','list','thread','side']);break;
   case 'copy': navigator.clipboard&&navigator.clipboard.writeText(el.dataset.v).catch(()=>{});closeMenu();toast('Copiado: '+el.dataset.v);break;
   case 'tab': S.tab=el.dataset.t;S.qr=null;rerender(['thread']);setTimeout(()=>{const t=document.getElementById('ta');t&&t.focus()},0);break;
   case 'tplTab': {const w=win(c);if(w.k=='r'||w.k=='none'){toast('La ventana está cerrada: elegí una plantilla de la lista.')}else{toast('Con la ventana abierta escribís libre. Las plantillas aparecen solas cuando se cierra.')}break}
   case 'tpl': S.tpl=+el.dataset.i;rerender(['thread']);break;
   case 'sendTpl': sendTpl();break;
   case 'send': send();break;
   case 'suggest': {const ta=document.getElementById('ta');ta.value=c.name=='Carla Domínguez'?'¡Perfecto Carla! Te agendo con Manuel el jueves 15 a las 15:00. ¿Te llama a este número?':`Hola ${firstName(c)}, gracias por escribir. ¿Me contás un poco más así te ayudo mejor?`;S.draft[c.id]=ta.value;ta.focus();toast('Sugerencia de la IA: revisala antes de enviar.');break}
   case 'slash': {if(!['g','a'].includes(win(c).k)||S.tab!='reply'){toast('Las respuestas rápidas se usan con la ventana abierta.');break}S.qr={f:'/',i:0};S.draft[c.id]='/';rerender(['thread']);const t2=document.getElementById('ta');t2.focus();t2.setSelectionRange(1,1);break}
   case 'qrPick': pickQR(+el.dataset.i);break;
   case 'sideTab': if(S.screen!='inbox'){S.screen='inbox';S.sideOpen=true;S.sideTab=el.dataset.t;render();break}if(S.sideOpen&&S.sideTab==el.dataset.t){S.sideOpen=false}else{S.sideOpen=true;S.sideTab=el.dataset.t}render();break;
   case 'sideClose': S.sideOpen=false;render();break;
   case 'newMsg': openNewMsg();break;
   case 'nmTpl': S.modal.tpl=+el.dataset.i;document.querySelectorAll('[data-a="nmTpl"]').forEach((b,i)=>b.classList.toggle('on',i==S.modal.tpl));break;
   case 'nmSend': {const n=document.getElementById('nmIn').value.trim()||'Contacto nuevo',p=document.getElementById('phIn').value.trim()||'+54 9 11 5555-0199';const t=B().templates[S.modal.tpl];const nc=C({name:n,biz:'',phone:p,state:'En gestión',setter:ME(),origin:'Iniciado desde la Bandeja',msgs:[M('out',t[2].replace('{nombre}',n.split(' ')[0]),NOW(),{tpl:t[0]})]});B().convs.unshift(nc);closeModal();S.screen='inbox';S.view='mine';S.funnel=null;S.search='';S.sel=nc.id;render();toast('Plantilla enviada a '+n+'.');break}
   case 'keys': closeMenu();openKeys();break;
   case 'role': S.role=el.dataset.r;closeMenu();S.view=S.role=='MA'?'calls':'mine';S.funnel=null;S.search='';{const L=listConvs();S.sel=L[0]?L[0].id:null}render();toast(S.role=='MA'?'Viendo como Manuel, closer: arranca en Mis llamadas.':'Viendo como Matías, setter.');break;
   case 'cfToggle': {const g=el.dataset.g;S.cFilter=S.cFilter.includes(g)?S.cFilter.filter(x=>x!=g):S.cFilter.concat(g);const m=S.menu;render();S.menu=null;openMenu('cfilter');break}
   case 'cfClear': S.cFilter=[];render();break;
   case 'toast': toast(el.dataset.t);break;
  }
  if(inDD&&a!='cfToggle'&&a!='menu'&&S.menu)closeMenu();
});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.f=='note'){e.preventDefault();const c=conv(S.sel),v=document.getElementById('noteIn').value.trim();if(!v)return;c.notes.push([v,uname(ME()),NOW()]);c.msgs.push(M('note',v,NOW(),{by:uname(ME())}));rerender(['list','thread','side']);toast('Nota guardada.')}});
document.addEventListener('input',e=>{
  if(e.target.id=='q'){S.search=e.target.value;if(S.screen=='inbox'){rerender(['nav','list'])}}
  if(e.target.id=='cq'){S.cSearch=e.target.value;const pos=e.target.selectionStart;render();const x=document.getElementById('cq');x.focus();x.setSelectionRange(pos,pos)}
  if(e.target.id=='ta'){const c=conv(S.sel);S.draft[c.id]=e.target.value;const v=e.target.value;
    if(S.tab=='reply'&&/^\/\S*$/.test(v)&&B().quick.length){S.qr={f:v,i:0};drawQR()}else if(S.qr){S.qr=null;drawQR()}}
});
function drawQR(){const cmp=document.querySelector('.cmp');if(!cmp)return;const old=cmp.querySelector('.qr');if(old)old.remove();if(S.qr)cmp.insertAdjacentHTML('afterbegin',qrPop())}
function pickQR(i){const it=qrItems()[i];if(!it)return;const c=conv(S.sel);S.qr=null;S.draft[c.id]=it[1];rerender(['thread']);const t=document.getElementById('ta');t.focus();t.setSelectionRange(t.value.length,t.value.length)}
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg.tagName=='INPUT'||tg.tagName=='TEXTAREA';
  if(e.key=='Escape'){if(S.qr){S.qr=null;drawQR();return}if(S.menu){closeMenu();return}if(S.modal){closeModal();return}if(typing)tg.blur();return}
  if(tg.id=='ta'){
    if(S.qr){const n=qrItems().length;if(e.key=='ArrowDown'){e.preventDefault();S.qr.i=(S.qr.i+1)%Math.max(1,n);drawQR();return}if(e.key=='ArrowUp'){e.preventDefault();S.qr.i=(S.qr.i-1+n)%Math.max(1,n);drawQR();return}if(e.key=='Enter'){e.preventDefault();pickQR(S.qr.i);return}}
    if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}return}
  if(typing||S.modal||e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.screen!='inbox')return;
  const k=e.key.toLowerCase();
  if(k=='j'){e.preventDefault();move(1)}
  else if(k=='k'){e.preventDefault();move(-1)}
  else if(k=='a'){e.preventDefault();const c=conv(S.sel);if(c&&!c.setter){c.setter=ME();c.msgs.push(M('ev',uname(ME())+' tomó la conversación',NOW()));rerender(['nav','list','thread','side']);toast('Tomaste la conversación de '+c.name+'.')}else takeNext()}
  else if(k=='l'){e.preventDefault();openSchedule()}
  else if(k=='e'){e.preventDefault();closeConv()}
  else if(k=='n'){e.preventDefault();S.tab='note';rerender(['thread']);document.getElementById('ta').focus()}
  else if(e.key=='/'){e.preventDefault();S.tab='reply';const c=conv(S.sel);if(c&&['g','a'].includes(win(c).k)){S.qr={f:'/',i:0};S.draft[c.id]='/';rerender(['thread']);const t=document.getElementById('ta');t.focus();t.setSelectionRange(1,1)}}
  else if(e.key=='?'){e.preventDefault();openKeys()}
});
window.addEventListener('resize',()=>{if(S.menu)closeMenu()});

/* reloj vivo: ventana de 24 h y tiempos */
setInterval(()=>{
  document.querySelectorAll('[data-w]').forEach(el=>{const c=conv(el.dataset.w);if(!c)return;const w=win(c);
    if(w.k=='g')el.innerHTML='<span class="d"></span>Ventana abierta · quedan '+dur(w.rem);else if(w.k=='a')el.innerHTML='<span class="d"></span>La ventana vence en '+dur(w.rem);});
  document.querySelectorAll('[data-wl]').forEach(el=>{const c=conv(el.dataset.wl);const w=win(c);if(w.k=='a')el.innerHTML=I('hourglass')+'Vence en '+dur(w.rem)});
},1000);
setInterval(()=>{if(S.screen=='inbox'&&!S.menu&&!S.modal)rerender(['list'])},60000);

/* inicio */
(function(){const L=listConvs();const c=B().convs.find(x=>x.name=='Carla Domínguez');S.sel=c.id;render();setTimeout(()=>toast('Prototipo v1 con datos ficticios. Probá Agendar llamada, Tomar siguiente, el selector de bandejas y “Ver como” Manuel.'),400)})();
</script>
